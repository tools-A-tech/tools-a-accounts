<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進行垢・引退垢・BOX公開アカウント</title>
  <style>

:root {
  --primary: #1da1f2;
  --primary-dark: #0d8bd9;
  --accent: #ff4444;
  --line: #06c755;
  --bg: #15202b;
  --surface: #1e2a38;
  --surface-soft: #192734;
  --text: #e7e9ea;
  --muted: #91a1af;
  --border: #2d3a48;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.22);
  --content-width: 1120px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: radial-gradient(circle at top, rgba(29,161,242,.08), transparent 420px), var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.65;
}
button, input, select { font: inherit; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  width: min(var(--content-width), calc(100% - 32px));
  margin: 0 auto;
  padding: 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--primary); color: #fff; font-weight: 800;
}
.brand-copy h1 { margin: 0; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.25; }
.brand-copy p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.header-note { color: var(--muted); font-size: 14px; white-space: nowrap; }

.back-link {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  transition: all .15s ease;
  flex-shrink: 0;
}
.back-link:hover {
  color: #fff;
  border-color: var(--primary);
  background: rgba(29,161,242,.12);
}



.main {
  width: min(var(--content-width), calc(100% - 32px));
  margin: 28px auto 60px;
}
.section-head { margin-bottom: 14px; }
.section-head h2 { margin: 0; font-size: 26px; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }

.category-bar {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 2px 14px;
}
.category-button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  min-height: 58px;
  padding: 8px 15px 8px 9px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
}
.category-button:hover { border-color: var(--primary); }
.category-button.active { color: #fff; border-color: var(--primary); background: var(--primary); }
.category-icon {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-soft); border: 1px solid var(--border);
  color: var(--primary); font-size: 18px; font-weight: 800;
}

.product-list { display: grid; gap: 16px; }
.product-card {
  min-height: 230px;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.product-media {
  position: relative;
  min-height: 230px;
  cursor: zoom-in;
  background: var(--surface-soft);
  overflow: hidden;
}
.product-media img { width: 100%; height: 100%; min-height: 230px; object-fit: cover; transition: transform .2s ease; }
.product-media:hover img { transform: scale(1.02); }
.image-count {
  position: absolute; right: 10px; bottom: 10px;
  padding: 5px 9px; border-radius: 999px;
  color: #fff; background: rgba(10,18,26,.76); font-size: 12px;
}

.product-body {
  padding: 22px 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 28px;
}
.product-main { min-width: 0; }
.game-name {
  display: block;
  margin-bottom: 7px;
  color: var(--primary);
  font-size: 18px;
  font-weight: 800;
}
.product-title {
  margin: 0;
  color: var(--primary);
  font-size: 30px;
  line-height: 1.35;
  font-weight: 800;
}
.summary {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 20px;
  line-height: 1.75;
}

.product-side {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-end;
}
.price-block { margin-bottom: 16px; text-align: right; }
.price-label { display: block; color: var(--muted); font-size: 15px; }
.price { display: block; color: var(--accent); font-size: 34px; line-height: 1.2; font-weight: 800; }
.contact-buttons { display: grid; gap: 9px; }
.contact-button {
  min-height: 48px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 18px;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
}
.contact-button.x { background: var(--primary); }
.contact-button.line { background: var(--line); }
.contact-button:hover { filter: brightness(.93); }

.empty-message {
  padding: 36px 20px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--muted);
  text-align: center;
}

.site-footer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); }
.footer-inner {
  width: min(var(--content-width), calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0;
  font-size: 13px;
}

.gallery-modal {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  padding: 24px; background: rgba(9,14,20,.94);
}
.gallery-modal.open { display: flex; }
.gallery-panel { position: relative; width: min(100%, 1040px); display: grid; place-items: center; }
.gallery-image { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; border-radius: 7px; }
.gallery-close, .gallery-nav {
  position: absolute; border: 0; color: #fff;
  background: rgba(0,0,0,.62); cursor: pointer;
  display: grid; place-items: center;
}
.gallery-close { width: 42px; height: 42px; right: 0; top: -52px; border-radius: 50%; font-size: 25px; }
.gallery-nav { width: 46px; height: 58px; top: 50%; transform: translateY(-50%); border-radius: 7px; font-size: 27px; }
.gallery-prev { left: 12px; }
.gallery-next { right: 12px; }
.gallery-counter {
  position: absolute; left: 50%; bottom: -42px; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,.55); border-radius: 999px;
  padding: 5px 10px; font-size: 13px;
}

/* スマホ表示：現在確定したサイズを維持 */
@media (max-width: 800px) {
  .header-note { display: none; }
  .product-list { gap: 10px; }
  .product-card {
    grid-template-columns: 138px minmax(0, 1fr);
    min-height: 0;
    border-radius: 10px;
  }
  .product-media {
    min-height: 0;
    aspect-ratio: 1/1;
    align-self: start;
    margin: 12px 0 12px 12px;
    border-radius: 9px;
  }
  .product-media img { width: 100%; height: 100%; min-height: 0; aspect-ratio: 1/1; object-fit: cover; }
  .image-count { right: 6px; bottom: 6px; padding: 3px 7px; font-size: 10px; }

  .product-body {
    min-width: 0;
    padding: 12px;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .game-name {
    margin-bottom: 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }
  .product-title {
    font-size: 16px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .summary {
    margin: 5px 0 0;
    font-size: 12px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-side {
    display: grid;
    grid-template-columns: minmax(90px, auto) minmax(0, 1fr);
    gap: 8px;
    align-items: end;
  }
  .price-block { margin: 0; text-align: left; }
  .price-label { font-size: 10px; }
  .price { font-size: 22px; }
  .contact-buttons { grid-template-columns: 1fr 1fr; gap: 6px; }
  .contact-button { min-height: 36px; padding: 7px 8px; font-size: 12px; white-space: nowrap; }
}

@media (max-width: 560px) {
  .header-inner, .main, .footer-inner { width: min(100% - 14px, var(--content-width)); }
  .header-inner { padding: 12px 0; }
  .brand-mark { width: 36px; height: 36px; }
  .brand-copy h1 { font-size: 19px; }
  .brand-copy p { display: none; }
  .main { margin-top: 12px; }
  .section-head h2 { font-size: 21px; }
  .section-head p { font-size: 12px; }
  .category-bar { gap: 7px; padding-bottom: 9px; }
  .category-button { min-height: 42px; padding: 5px 10px 5px 6px; border-radius: 10px; font-size: 12px; }
  .category-icon { width: 30px; height: 30px; font-size: 14px; }

  .product-card { grid-template-columns: 126px minmax(0, 1fr); }
  .product-media { margin: 10px 0 10px 10px; border-radius: 8px; }
  .product-body { padding: 10px; gap: 7px; }
  .product-title { font-size: 15px; }
  .summary { font-size: 11px; -webkit-line-clamp: 3; }
  .product-side { grid-template-columns: 84px minmax(0, 1fr); }
  .price { font-size: 20px; }
  .contact-button { min-height: 34px; font-size: 11px; padding: 6px; }
}

@media (max-width: 390px) {
  .product-card { grid-template-columns: 116px minmax(0, 1fr); }
  .product-media { margin: 9px 0 9px 9px; }
  .product-body { padding: 9px; }
  .product-title { font-size: 14px; }
  .summary { font-size: 10.5px; }
  .product-side { grid-template-columns: 78px minmax(0, 1fr); }
  .price { font-size: 18px; }
  .contact-button { font-size: 10px; }
}

</style>

async function loadJson(path, fallback) {
  try {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error(`${path}: ${response.status}`);
    return await response.json();
  } catch (error) {
    console.warn("ローカルプレビュー用データを使用します。", error);
    return fallback;
  }
}

function formatPrice(value) {
  return new Intl.NumberFormat("ja-JP", {
    style: "currency",
    currency: "JPY",
    maximumFractionDigits: 0
  }).format(value);
}

function renderCategories() {
  const items = [{ id: "all", name: "すべて", icon: "全" }, ...state.games];
  categoryBar.innerHTML = items.map(game => `
    <button class="category-button ${state.category === game.id ? "active" : ""}"
      type="button" data-category="${game.id}">
      <span class="category-icon">${game.icon || "●"}</span>
      <span>${game.name}</span>
    </button>
  `).join("");

  categoryBar.querySelectorAll(".category-button").forEach(button => {
    button.addEventListener("click", () => {
      state.category = button.dataset.category;
      renderCategories();
      renderProducts();
    });
  });
}

function renderProducts() {
  const visible = state.category === "all"
    ? state.products
    : state.products.filter(product => product.gameId === state.category);

  productList.innerHTML = visible.map(product => `
    <article class="product-card">
      <div class="product-media" role="button" tabindex="0"
        aria-label="${product.title}の画像を拡大"
        data-product-id="${product.id}">
        <img src="${(product.images && product.images[0]) || ''}" alt="${product.title}の商品画像">
        <span class="image-count">画像 ${(product.images && product.images.length) || 0}枚</span>
      </div>

      <div class="product-body">
        <div class="product-main">
          <span class="game-name">${product.gameName}</span>
          <h3 class="product-title">${product.title}</h3>
          <p class="summary">${product.description}</p>
        </div>

        <aside class="product-side">
          <div class="price-block">
            <span class="price-label">販売価格</span>
            <strong class="price">${formatPrice(product.price)}</strong>
          </div>
          <div class="contact-buttons">
            <a class="contact-button x" href="https://x.com/messages/compose?recipient_id=1641057230408540163" target="_blank" rel="noopener">📩 Xで連絡</a>
            <a class="contact-button line" href="https://line.me/ti/p/9v4gGIz11z" target="_blank" rel="noopener">💬 LINEで連絡</a>
          </div>
        </aside>
      </div>
    </article>
  `).join("");

  emptyMessage.hidden = visible.length !== 0;

  productList.querySelectorAll(".product-media").forEach(media => {
    const open = () => {
      const product = state.products.find(item => item.id === media.dataset.productId);
      if (product) openGallery(product.images);
    };
    media.addEventListener("click", open);
    media.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open();
      }
    });
  });
}

function renderGallery() {
  if (!state.galleryImages.length) return;
  galleryImage.src = state.galleryImages[state.galleryIndex];
  galleryCounter.textContent = `${state.galleryIndex + 1} / ${state.galleryImages.length}`;
}

function openGallery(images) {
  state.galleryImages = images;
  state.galleryIndex = 0;
  renderGallery();
  galleryModal.classList.add("open");
  galleryModal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  galleryClose.focus();
}

function closeGallery() {
  galleryModal.classList.remove("open");
  galleryModal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function moveGallery(direction) {
  const total = state.galleryImages.length;
  if (!total) return;
  state.galleryIndex = (state.galleryIndex + direction + total) % total;
  renderGallery();
}

galleryClose.addEventListener("click", closeGallery);
galleryPrev.addEventListener("click", () => moveGallery(-1));
galleryNext.addEventListener("click", () => moveGallery(1));
galleryModal.addEventListener("click", event => {
  if (event.target === galleryModal) closeGallery();
});
galleryModal.addEventListener("touchstart", event => {
  state.touchStartX = event.changedTouches[0].clientX;
}, { passive: true });
galleryModal.addEventListener("touchend", event => {
  const difference = event.changedTouches[0].clientX - state.touchStartX;
  if (Math.abs(difference) >= 45) moveGallery(difference > 0 ? -1 : 1);
}, { passive: true });
document.addEventListener("keydown", event => {
  if (!galleryModal.classList.contains("open")) return;
  if (event.key === "Escape") closeGallery();
  if (event.key === "ArrowLeft") moveGallery(-1);
  if (event.key === "ArrowRight") moveGallery(1);
});

async async function initialize() {
  try {
    state.games = await loadJson("data/games.json", FALLBACK_GAMES);
    state.products = await loadJson("data/products.json", FALLBACK_PRODUCTS);
  } catch (e) {
    console.warn("データ読み込みに失敗したためフォールバックを使用します。", e);
    state.games = FALLBACK_GAMES;
    state.products = FALLBACK_PRODUCTS;
  }
  renderCategories();
  renderProducts();
}

initialize();

</script>
</body>
</html>
