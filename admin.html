<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 - 進行垢・引退垢・BOX公開アカウント</title>
  <style>
:root {
  --primary: #1da1f2;
  --primary-dark: #0d8bd9;
  --accent: #ff4444;
  --line: #06c755;
  --bg: #15202b;
  --surface: #1e2a38;
  --surface-soft: #192734;
  --text: #e7e9ea;
  --muted: #91a1af;
  --border: #2d3a48;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.22);
  --content-width: 1120px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: radial-gradient(circle at top, rgba(29,161,242,.08), transparent 420px), var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.65;
}
button, input, select, textarea { font: inherit; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  width: min(var(--content-width), calc(100% - 32px));
  margin: 0 auto;
  padding: 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--primary); color: #fff; font-weight: 800;
}
.brand-copy h1 { margin: 0; font-size: 22px; line-height: 1.25; }
.brand-copy p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.main {
  width: min(var(--content-width), calc(100% - 32px));
  margin: 24px auto 60px;
}

.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.section h2 {
  margin: 0 0 16px;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text);
}
textarea { min-height: 90px; resize: vertical; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: 999px;
  border: none;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); }
.btn-primary:hover { filter: brightness(.93); }
.btn-danger { background: var(--accent); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

.game-list, .product-admin-list {
  display: grid;
  gap: 10px;
}
.game-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.product-admin-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.product-admin-card .top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.product-admin-card .meta {
  font-size: 13px;
  color: var(--muted);
}
.product-admin-card .actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
  background: var(--surface-soft);
  cursor: pointer;
  transition: border-color .2s, background .2s;
  margin-top: 6px;
}
.drop-zone.dragover {
  border-color: var(--primary);
  background: rgba(29,161,242,.08);
  color: var(--primary);
}
.preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.preview-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #000;
}
.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.preview-item .remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,.75);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  line-height: 1;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(9,14,20,.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: min(640px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 16px; font-size: 22px; }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.empty { color: var(--muted); text-align: center; padding: 20px; }
.status {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
}

@media (max-width: 600px) {
  .header-inner { padding: 12px 0; }
  .brand-copy h1 { font-size: 18px; }
  .form-grid { grid-template-columns: 1fr; }
  .product-admin-card .top { flex-direction: column; }
  .product-admin-card .actions { width: 100%; }
  .btn { width: 100%; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-copy">
          <h1>管理画面</h1>
          <p>商品・タイトルの追加・編集・削除（ローカル専用）</p>
        </div>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-sm" id="publishBtn" type="button" style="background:#06c755;">🚀 GitHubへ公開</button>
        <a href="/" class="btn btn-secondary btn-sm">公開ページへ →</a>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- ゲーム管理 -->
    <section class="section">
      <h2>
        タイトル（ゲーム）管理
      </h2>
      <div class="form-grid">
        <div>
          <label>ID（英数字・ハイフン推奨）</label>
          <input type="text" id="gameId" placeholder="例: monst" autocomplete="off">
        </div>
        <div>
          <label>表示名（カテゴリ用短名）</label>
          <input type="text" id="gameName" placeholder="例: モンスト">
        </div>
        <div>
          <label>正式名称（商品に表示）</label>
          <input type="text" id="gameFullName" placeholder="例: モンスターストライク">
        </div>
        <div>
          <label>アイコン（1文字 or 絵文字）</label>
          <input type="text" id="gameIcon" placeholder="M または ⚾" maxlength="4">
        </div>
      </div>
      <button class="btn btn-primary" id="addGameBtn">＋ タイトル追加</button>
      <div class="game-list" id="gameList" style="margin-top:16px;"></div>
    </section>

    <!-- 商品管理 -->
    <section class="section">
      <h2>
        商品管理
        <button class="btn btn-primary btn-sm" id="openAddProductBtn">＋ 新規商品</button>
      </h2>
      <div class="product-admin-list" id="productList"></div>
      <div class="empty" id="productEmpty" hidden>商品がありません。右上の「＋ 新規商品」から追加してください。</div>
    </section>
  </main>

  <!-- 商品モーダル -->
  <div class="modal-overlay" id="productModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">商品を追加</h3>
      <input type="hidden" id="editProductId">

      <div class="form-grid">
        <div>
          <label>ゲーム</label>
          <select id="productGameId"></select>
        </div>
        <div>
          <label>価格（円）</label>
          <input type="number" id="productPrice" min="0" step="100" value="0">
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label>タイトル</label>
        <input type="text" id="productTitle" placeholder="例: 限定キャラ多数・オーブ4,417個">
      </div>
      <div style="margin-bottom:12px;">
        <label>説明文</label>
        <textarea id="productDescription" placeholder="詳細説明（BOX内容など）"></textarea>
      </div>
      <div class="form-grid">
        <div>
          <label>X URL</label>
          <input type="url" id="productXUrl" placeholder="https://x.com/...">
        </div>
        <div>
          <label>LINE URL</label>
          <input type="url" id="productLineUrl" placeholder="https://line.me/... または #">
        </div>
      </div>

      <div style="margin-top:16px;">
        <label>画像（ドラッグ＆ドロップ or クリックで追加・複数可）</label>
        <div class="drop-zone" id="dropZone">
          ここに画像をドロップ<br>
          <small>またはクリックして選択（JPG / PNG / WebP / GIF）</small>
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
        <p class="status" id="imageStatus"></p>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelModalBtn" type="button">キャンセル</button>
        <button class="btn btn-primary" id="saveProductBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let games = [];
    let products = [];
    // pendingImages: { file?: File, url: string, isNew: boolean }
    let pendingImages = [];

    async function api(path, options = {}) {
      const res = await fetch(API + path, options);
      if (!res.ok) {
        let msg = res.statusText;
        try {
          const data = await res.json();
          msg = data.detail || JSON.stringify(data);
        } catch (_) {
          try { msg = await res.text(); } catch (_) {}
        }
        throw new Error(msg || "リクエストに失敗しました");
      }
      if (res.status === 204) return null;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return res.json();
      return res.text();
    }

    function formatPrice(v) {
      return new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }).format(v || 0);
    }

    async function loadAll() {
      try {
        games = await api("/api/games");
        products = await api("/api/products");
        renderGames();
        renderProducts();
        fillGameSelect();
      } catch (e) {
        console.error(e);
        alert("データの読み込みに失敗しました。\nサーバーが起動しているか確認してください。\n\n" + e.message);
      }
    }

    // ========== ゲーム ==========
    function renderGames() {
      const list = document.getElementById("gameList");
      if (!games.length) {
        list.innerHTML = '<div class="empty">タイトルがありません</div>';
        return;
      }
      list.innerHTML = games.map(g => `
        <div class="game-item">
          <div>
            <strong>${escapeHtml(g.icon || "●")} ${escapeHtml(g.name)}</strong>
            <span style="margin-left:8px;color:var(--muted);font-size:13px;">id: ${escapeHtml(g.id)}</span>
            ${g.fullName ? `<div style="font-size:12px;color:var(--muted);margin-top:2px;">${escapeHtml(g.fullName)}</div>` : ""}
          </div>
          <button class="btn btn-danger btn-sm" type="button" data-delete-game="${escapeHtml(g.id)}">削除</button>
        </div>
      `).join("");

      list.querySelectorAll("[data-delete-game]").forEach(btn => {
        btn.addEventListener("click", () => deleteGame(btn.dataset.deleteGame));
      });
    }

    function fillGameSelect() {
      const sel = document.getElementById("productGameId");
      sel.innerHTML = games.map(g =>
        `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name)} (${escapeHtml(g.fullName || g.name)})</option>`
      ).join("");
    }

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("addGameBtn").addEventListener("click", async () => {
      const id = document.getElementById("gameId").value.trim();
      const name = document.getElementById("gameName").value.trim();
      const fullName = document.getElementById("gameFullName").value.trim() || name;
      const icon = document.getElementById("gameIcon").value.trim() || "●";
      if (!id || !name) {
        alert("IDと表示名は必須です");
        return;
      }
      try {
        await api("/api/games", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, name, fullName, icon })
        });
        document.getElementById("gameId").value = "";
        document.getElementById("gameName").value = "";
        document.getElementById("gameFullName").value = "";
        document.getElementById("gameIcon").value = "";
        await loadAll();
      } catch (e) {
        alert("追加失敗: " + e.message);
      }
    });

    async function deleteGame(id) {
      if (!confirm(`タイトル「${id}」を削除しますか？\n関連する商品がある場合は削除できません。`)) return;
      try {
        await api("/api/games/" + encodeURIComponent(id), { method: "DELETE" });
        await loadAll();
      } catch (e) {
        alert("削除失敗: " + e.message);
      }
    }

    // ========== 商品 ==========
    function renderProducts() {
      const list = document.getElementById("productList");
      const empty = document.getElementById("productEmpty");
      if (!products.length) {
        list.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      list.innerHTML = products.map(p => `
        <div class="product-admin-card">
          <div class="top">
            <div>
              <div style="color:var(--primary);font-weight:700;">${escapeHtml(p.gameName || p.gameId)}</div>
              <div style="font-size:17px;font-weight:800;margin:4px 0;">${escapeHtml(p.title)}</div>
              <div class="meta">${formatPrice(p.price)} ／ 画像 ${(p.images || []).length}枚 ／ id: ${escapeHtml(p.id)}</div>
            </div>
            <div class="actions">
              <button class="btn btn-primary btn-sm" type="button" data-edit="${escapeHtml(p.id)}">編集</button>
              <button class="btn btn-danger btn-sm" type="button" data-delete="${escapeHtml(p.id)}">削除</button>
            </div>
          </div>
        </div>
      `).join("");

      list.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => openEditProduct(btn.dataset.edit));
      });
      list.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => deleteProduct(btn.dataset.delete));
      });
    }

    async function deleteProduct(id) {
      if (!confirm("この商品を削除しますか？関連画像ファイルも削除されます。")) return;
      try {
        await api("/api/products/" + encodeURIComponent(id), { method: "DELETE" });
        await loadAll();
      } catch (e) {
        alert("削除失敗: " + e.message);
      }
    }

    // ========== モーダル & 画像 ==========
    const modal = document.getElementById("productModal");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const previewGrid = document.getElementById("previewGrid");
    const imageStatus = document.getElementById("imageStatus");

    function openModal(isEdit) {
      document.getElementById("modalTitle").textContent = isEdit ? "商品を編集" : "商品を追加";
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      pendingImages.forEach(img => {
        if (img.isNew && img.url && img.url.startsWith("blob:")) {
          try { URL.revokeObjectURL(img.url); } catch (_) {}
        }
      });
      pendingImages = [];
      previewGrid.innerHTML = "";
      fileInput.value = "";
      imageStatus.textContent = "";
    }

    document.getElementById("openAddProductBtn").addEventListener("click", () => {
      document.getElementById("editProductId").value = "";
      document.getElementById("productTitle").value = "";
      document.getElementById("productDescription").value = "";
      document.getElementById("productPrice").value = "0";
      document.getElementById("productXUrl").value = "https://x.com/tools_A_";
      document.getElementById("productLineUrl").value = "#";
      if (games.length) {
        document.getElementById("productGameId").value = games[0].id;
      }
      pendingImages = [];
      renderPreviews();
      openModal(false);
    });

    document.getElementById("cancelModalBtn").addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    function openEditProduct(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById("editProductId").value = p.id;
      document.getElementById("productGameId").value = p.gameId;
      document.getElementById("productTitle").value = p.title || "";
      document.getElementById("productDescription").value = p.description || "";
      document.getElementById("productPrice").value = p.price || 0;
      document.getElementById("productXUrl").value = p.xUrl || "";
      document.getElementById("productLineUrl").value = p.lineUrl || "#";
      pendingImages = (p.images || []).map(url => ({ url, isNew: false }));
      renderPreviews();
      openModal(true);
    }

    // DnD
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => {
      handleFiles(fileInput.files);
      fileInput.value = "";
    });

    function handleFiles(fileList) {
      const files = Array.from(fileList || []);
      let added = 0;
      files.forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const url = URL.createObjectURL(file);
        pendingImages.push({ file, url, isNew: true });
        added++;
      });
      if (added) {
        imageStatus.textContent = `${added}枚の画像を追加しました（保存時にアップロードされます）`;
      }
      renderPreviews();
    }

    function renderPreviews() {
      previewGrid.innerHTML = pendingImages.map((img, i) => `
        <div class="preview-item">
          <img src="${img.url}" alt="preview ${i + 1}">
          <button class="remove" type="button" data-remove="${i}" title="削除">×</button>
        </div>
      `).join("");
      previewGrid.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.remove);
          const item = pendingImages[idx];
          if (item && item.isNew && item.url && item.url.startsWith("blob:")) {
            try { URL.revokeObjectURL(item.url); } catch (_) {}
          }
          pendingImages.splice(idx, 1);
          renderPreviews();
        });
      });
    }

    // 保存
    document.getElementById("saveProductBtn").addEventListener("click", async () => {
      const editId = document.getElementById("editProductId").value;
      const gameId = document.getElementById("productGameId").value;
      const title = document.getElementById("productTitle").value.trim();
      const description = document.getElementById("productDescription").value.trim();
      const price = Number(document.getElementById("productPrice").value) || 0;
      const xUrl = document.getElementById("productXUrl").value.trim() || "#";
      const lineUrl = document.getElementById("productLineUrl").value.trim() || "#";

      if (!gameId || !title) {
        alert("ゲームとタイトルは必須です");
        return;
      }

      const game = games.find(g => g.id === gameId);
      // fullName 優先、なければ name、さらにフォールバックマップ
      const gameName = (game && (game.fullName || game.name)) || gameId;

      const saveBtn = document.getElementById("saveProductBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中…";

      try {
        // 新規画像をアップロード
        const newFiles = pendingImages.filter(p => p.isNew && p.file).map(p => p.file);
        let uploadedPaths = [];
        if (newFiles.length) {
          const fd = new FormData();
          newFiles.forEach(f => fd.append("files", f));
          const result = await api("/api/upload", { method: "POST", body: fd });
          uploadedPaths = (result && result.paths) ? result.paths : (Array.isArray(result) ? result : []);
        }

        // 既存画像（相対パス or data URI） + 新規アップロードパス
        const finalImages = [
          ...pendingImages.filter(p => !p.isNew).map(p => p.url),
          ...uploadedPaths
        ];

        const body = {
          gameId,
          gameName,
          title,
          description,
          price,
          images: finalImages,
          xUrl,
          lineUrl
        };

        if (editId) {
          await api("/api/products/" + encodeURIComponent(editId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        } else {
          // クライアント側で分かりやすい連番IDを生成
          const sameGame = products.filter(p => p.gameId === gameId);
          const nextNum = String(sameGame.length + 1).padStart(3, "0");
          body.id = `${gameId}-${nextNum}`;
          await api("/api/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        }

        closeModal();
        await loadAll();
      } catch (e) {
        alert("保存失敗: " + e.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存";
      }
    });

    // ========== GitHub 公開 ==========
    document.getElementById("publishBtn").addEventListener("click", async () => {
      const btn = document.getElementById("publishBtn");
      const original = btn.textContent;

      try {
        // 状態確認
        let status = null;
        try {
          status = await api("/api/git/status");
        } catch (_) {}

        if (status && status.is_repo === false) {
          alert(status.message || "このフォルダは Git リポジトリではありません。\n先に git init と remote 設定を行ってください。");
          return;
        }

        if (status && !status.dirty) {
          if (!confirm("現在、公開待ちの変更はありません。\nそれでも push を試みますか？")) return;
        }

        const defaultMsg = `Update products via admin - ${new Date().toLocaleString("ja-JP")}`;
        const msg = prompt("コミットメッセージを入力してください：", defaultMsg);
        if (msg === null) return;

        if (!confirm(`以下のメッセージで GitHub に公開します。よろしいですか？\n\n${msg}`)) return;

        btn.disabled = true;
        btn.textContent = "公開中…";

        const result = await api("/api/git/publish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg || defaultMsg }),
        });

        let text = result.message || "完了しました";
        if (result.pushed) {
          text += "\n\n顧客向けの GitHub Pages URL に反映されます（通常1〜3分）。";
        } else if (result.committed) {
          text += "\n\nターミナルで次を実行してください：\ngit push";
        }
        alert(text);
      } catch (e) {
        alert("公開に失敗しました：\n" + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });

    // 初期化
    loadAll();
  </script>
</body>
</html>
